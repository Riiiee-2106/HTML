<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pre Tag</title>  <!--preserve text formatting-->
</head>
<body>
    <h1>this is my heading without
        preserving text 
        formatting
    </h1>

    <pre><h1>this is
        also a heading
                    with preserving
        text formatting
    </h1></pre>
</body>
</html>
