<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <form action="/" method="post">
    <label for="username">Username
      <input type="text" name="username" id="username" placeholder="enter username">
    </label>

    <label for="password">Password
      <input id="password" placeholder="12345" type="password">
    </label>

    <label for="date">Date
      <input id="date" type="date">
    </label>

    <div>
      <label for="file">File
        <input id="file" type="file">
      </label>
    </div>

    <div>
      <label>Color
        <input type="color">
      </label>
    </div>

    <div>
      <label>Range
        <input type="range">
      </label>
    </div>

    <div>
      <label>Button
        <input type="button" value="click me">
      </label>
    </div>

    <div>
      <input type="submit" value="submit">
    </div>

    <div>
      <label for="female">Female
        <input type="radio" value="female" name="gender" id="female">
      </label>
      <label for="male">Male
        <input type="radio" value="male" name="gender" id="male">
      </label>
      <label for="trans">Trans
        <input type="radio" value="trans" name="gender" id="trans">
      </label>
    </div>

    <div>
      <label for="apple">Apple
        <input type="checkbox" value="apple" name="fruit" id="apple">
      </label>
      <label for="banana">Banana
        <input type="checkbox" value="banana" name="fruit" id="banana">
      </label>
      <label for="kiwi">Kiwi
        <input type="checkbox" value="kiwi" name="fruit" id="kiwi">
      </label>
    </div>

    <div>
      <label for="country">Select your Country</label>
      <select name="country" id="country">
        <option value="India">India</option>
        <option value="US">US</option>
        <option value="UK">UK</option>
        <option value="other">Other</option>
      </select>
    </div>

    <div>
      <label for="story">Your Review</label><br>
      <textarea name="story" id="story" cols="60" rows="4">please write your reviews</textarea>
    </div>
  </form>
</body>
</html>
